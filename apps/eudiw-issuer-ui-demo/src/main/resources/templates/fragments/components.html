<div th:fragment="back_link_fragment(href)">
    <a th:href="@{${href}}"
       class="ds-link back-link"
       data-color="neutral">
        <span class="back-link__content">
            <svg aria-hidden="true"
                 width="20"
                 height="20"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
            </svg>
            <span>Tilbake</span>
        </span>
    </a>
</div>

<div th:fragment="qr_code_fragment(src, alt)"
     id="cross-device-request"
     class="qr-code-container">
    <img th:src="${src}"
         th:alt="${alt}"
         id="qrcode-cross-device"
         class="qr-code"/>
</div>

<nav th:fragment="step_navigation_fragment(previousHref, previousLabel, nextHref, nextLabel, nextForm, nextDisabledUntilSelection, dynamicNextForm, nextColor)"
     class="step-navigation"
     aria-label="Navigasjon mellom steg">
    <a th:if="${previousHref != null}"
       th:href="@{${previousHref}}"
       class="ds-button step-navigation__button"
       data-variant="secondary">
        <span class="step-navigation__direction">Tilbake</span>
        <span th:text="${previousLabel}"></span>
    </a>
    <a th:if="${nextHref != null}"
       th:href="@{${nextHref}}"
       class="ds-button step-navigation__button step-navigation__button--next"
       th:attr="data-color=${nextColor}"
       data-variant="primary">
        <span class="step-navigation__direction">Neste</span>
        <span th:text="${nextLabel}"></span>
    </a>
    <button th:if="${nextHref == null && nextForm != null && !nextDisabledUntilSelection && !dynamicNextForm}"
            th:attr="form=${nextForm}, data-color=${nextColor}"
            class="ds-button step-navigation__button step-navigation__button--next"
            type="submit"
            data-variant="primary">
        <span class="step-navigation__direction">Neste</span>
        <span th:text="${nextLabel}"></span>
    </button>
    <button th:if="${nextHref == null && nextForm != null && nextDisabledUntilSelection && !dynamicNextForm}"
            th:attr="form=${nextForm}, data-color=${nextColor}"
            class="ds-button step-navigation__button step-navigation__button--next"
            type="submit"
            data-variant="primary"
            disabled
            x-bind:disabled="!selectedId">
        <span class="step-navigation__direction">Neste</span>
        <span th:text="${nextLabel}"></span>
    </button>
    <button th:if="${nextHref == null && dynamicNextForm}"
            class="ds-button step-navigation__button step-navigation__button--next"
            type="submit"
            data-variant="primary"
            th:attr="data-color=${nextColor}"
            disabled
            x-bind:form="selectedForm"
            x-bind:disabled="!selectedForm">
        <span class="step-navigation__direction">Neste</span>
        <span th:text="${nextLabel}"></span>
    </button>
</nav>

<span th:fragment="step_indicator_fragment(number, text, current)"
      class="stepper__step"
      th:classappend="${current} ? 'stepper__step--current' : ''">
    <span class="stepper__indicator" th:text="${number}"></span>
    <span class="stepper__text" th:text="${text}"></span>
</span>

<nav th:fragment="stepper_fragment(steps, currentStep)"
     class="stepper"
     aria-label="Steg">
    <ol>
        <li th:each="step, status : ${steps}"
            th:attr="aria-current=${currentStep == status.count} ? 'step'">
            <span th:replace="~{:: step_indicator_fragment(
                number=${status.count},
                text=${step},
                current=${currentStep == status.count}
            )}"></span>
        </li>
    </ol>
</nav>

<dl th:fragment="claim_list_fragment(claims)" class="verification-result__claims">
    <div class="verification-result__claim"
         th:each="claim : ${claims}"
         th:classappend="${claim.group} ? 'verification-result__claim--group' : ''">
        <dt th:text="${claim.name}"></dt>
        <dd
                th:if="${!claim.group}"
                class="verification-result__claim-value"
                th:text="${#strings.abbreviate(claim.value, 40)}"
                th:attr="data-full-value=${claim.value}"
        ></dd>
        <dd th:if="${claim.group}">
            <div th:replace="~{:: claim_list_fragment(claims=${claim.children})}"></div>
        </dd>
    </div>
    <script th:inline="javascript">
        (function() {
            const claimValueTagArray = document.querySelectorAll("dd.verification-result__claim-value")
            for (const claimValueTag of claimValueTagArray) {
                const claimValue = claimValueTag.getAttribute("data-full-value");

                claimValueTag.addEventListener("click", function(event) {
                    copyToClipboard(claimValue, event.target);
                });
            }

            function displayMessage(message, target) {
                const messageElement = document.createElement("div");
                messageElement.className = "mini_message"
                messageElement.textContent = message;

                const coordinates = target
                    ? target.getBoundingClientRect()
                    : {
                        top: window.innerHeight / 2,
                        left: window.innerWidth / 2
                    };

                messageElement.style.top = `${coordinates.top}px`;
                messageElement.style.left = `${coordinates.left}px`;

                document.body.appendChild(messageElement);

                setTimeout(() => {
                    messageElement.remove();
                }, 2000);
            }

            function copyToClipboard(text, target) {
                navigator.clipboard.writeText(text).then(function() {
                    console.log("Copied!");
                    displayMessage('Copied!', target);
                }, function(err) {
                    console.error('Could not copy text: ', err);
                });
            }
        })()
</script>
</dl>
