<!--/*
  claim.html — Thymeleaf fragment for server-side fallback rendering.
  In add-new / edit-new the claim rows are generated by credential-form.js
  (renderClaims / buildClaimRow) and this fragment is NOT looped over.
  The fragment is kept for any page that still does a server-side claims loop.
  The JS-generated rows use the same field names (claims[N].path etc.) and
  the same CSS classes (.claim, .claim_field) so styling is shared.
*/-->
<div class="claim" th:fragment="claim(index, claimData)">

    <div class="claim_field">
        <label class="ds-sr-only" th:for="|claims[${index}].path|">Sti for claim</label>
        <input class="ds-input"
               type="text"
               th:id="|claims[${index}].path|"
               th:name="|claims[${index}].path|"
               th:value="${claimData != null ? claimData.path : ''}"
               placeholder="Sti (path)"
               aria-label="Sti (path)" />

        <label class="ds-sr-only" th:for="|claims[${index}].name|">Visingsnamn for claim</label>
        <input class="ds-input"
               type="text"
               th:id="|claims[${index}].name|"
               th:name="|claims[${index}].name|"
               th:value="${claimData != null ? claimData.name : ''}"
               placeholder="Visingsnamn"
               aria-label="Visingsnamn" />
    </div>

    <div class="claim_field">
        <label class="ds-sr-only" th:for="|claims[${index}].type|">Type for claim</label>
        <select class="ds-input"
                th:id="|claims[${index}].type|"
                th:name="|claims[${index}].type|"
                aria-label="Type for claim">
            <option disabled th:selected="${claimData == null or claimData.type == null}" value="">Vel ein type</option>
            <option value="string" th:selected="${claimData != null and claimData.type == 'string'}">string</option>
            <option value="binary" th:selected="${claimData != null and claimData.type == 'binary'}">binary</option>
            <option value="number" th:selected="${claimData != null and claimData.type == 'number'}">number</option>
            <option value="boolean" th:selected="${claimData != null and claimData.type == 'boolean'}">boolean</option>
            <option value="iso_date" th:selected="${claimData != null and claimData.type == 'iso_date'}">iso_date</option>
            <option value="iso_date_time" th:selected="${claimData != null and claimData.type == 'iso_date_time'}">iso_date_time</option>
            <option disabled value="map">map</option>
            <option disabled value="list">list</option>
        </select>

        <label class="ds-sr-only" th:for="|claims[${index}].mimeType|">MIME-type for claim</label>
        <input class="ds-input"
               type="text"
               th:id="|claims[${index}].mimeType|"
               th:name="|claims[${index}].mimeType|"
               th:value="${claimData != null ? claimData.mimeType : ''}"
               placeholder="MIME-type (t.d. image/png)"
               aria-label="MIME-type"
               th:style="${claimData != null and claimData.type == 'binary'} ? '' : 'display:none'" />

        <label class="ds-sr-only" th:for="|claims[${index}].exampleValue|">Dømeverdi for claim</label>
        <input class="ds-input"
               type="text"
               th:id="|claims[${index}].exampleValue|"
               th:name="|claims[${index}].exampleValue|"
               th:value="${claimData != null ? claimData.exampleValue : ''}"
               placeholder="Dømeverdi"
               aria-label="Dømeverdi" />
    </div>

    <button class="ds-button"
            data-color="danger"
            data-variant="tertiary"
            type="button"
            onclick="removeClaim(this)">
        Slett
    </button>
</div>
