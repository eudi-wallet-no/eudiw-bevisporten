<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn-no">
<head>
    <th:block th:replace="~{fragments/layout :: base_head_fragment}"></th:block>
    <title>Presenter bevis på mobilen | Bevisgenerator</title>
</head>
<body>
<header th:replace="~{fragments/layout :: page_header_fragment}"></header>
<main id="main-content" tabindex="-1">
    <div class="page-heading">
        <div th:replace="~{fragments/components :: back_link_fragment(href='/verification-start')}"></div>
        <div class="landing-intro">
            <h1 class="ds-heading" data-size="xl">
                Presenter bevis
            </h1>
        </div>
    </div>
    <div th:replace="~{fragments/components :: stepper_fragment(steps=${steps}, currentStep=2)}"></div>
    <div class="ds-card card-narrow"
         data-color="neutral"
         data-variant="default">
        <div th:replace="~{fragments/components :: qr_code_fragment(
            src=${qrCode},
            alt='QR-kode for verifikasjon'
        )}"></div>
        <p id="verification-status-message" class="ds-paragraph status-message"></p>
        <div class="button-group">
            <a th:href="@{/verification-result/{verificationId}(verificationId=${verificationId})}" id="navigate-to-result-button" class="ds-button" style="display:none;">
                Sjå resultatet
            </a>
            <a th:href="${authorizationRequest}" id="same-device-button" class="ds-button" data-variant="primary">
                Opne på mobilen
            </a>
            <a th:href="@{/verification-start}" class="ds-button" type="button" data-variant="secondary">
                Tilbake
            </a>
        </div>
    </div>
    <div id="tracing">
        <details class="ds-details" data-variant="default">
            <summary>Request til verifier-service</summary>
            <div>
                <code>POST <span th:text="${requestUri}"></span></code>
                <br/>
                <code class="code-block" th:text="${requestBody}"></code>
            </div>
        </details>
        <details class="ds-details" data-variant="default">
            <summary>Respons frå verifier-service</summary>
            <div>
                <code class="code-block" th:text="${responseBody}"></code>
            </div>
        </details>
    </div>
</main>
<footer th:replace="~{fragments/layout :: page_footer_fragment(issuer=${issuerUrl})}"></footer>
<script th:inline="javascript">
    const statusMessage = document.getElementById("verification-status-message");
    const statusEndpoint = /*[[@{/verification-presentation/{verificationId}/status(verificationId=${verificationId})}]]*/ "";
    const resultUrl = /*[[@{/verification-result/{verificationId}(verificationId=${verificationId})}]]*/ "";
    const sameDeviceButton = document.getElementById("same-device-button");
    const navigateToResultButton = document.getElementById("navigate-to-result-button");
    const qrCode = document.getElementById("cross-device-request");

    let stopped = false;
    let sameDeviceFlow = false;

    sameDeviceButton.addEventListener("click", () => {
        stopped = true;
        sameDeviceFlow = true;
    });

    function updateStatusMessage(message) {
        statusMessage.textContent = message;
    }

    function redirectToResultPage() {
        document.location.assign(resultUrl);
    }

    const debounce = (func, wait) => {
        let timeout;
        return function (...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    };

    const debouncedRedirectToResultPage = debounce(redirectToResultPage, 1000);

    function waitForUserBeforeRedirectToResultPage() {
        const redirect = () => {
            window.removeEventListener("focus", redirect);
            document.removeEventListener("visibilitychange", redirectWhenVisible);

            debouncedRedirectToResultPage();
        }

        const redirectWhenVisible = () => {
            if (document.visibilityState === "visible") {
                redirect();
            }
        };

        updateStatusMessage("Verifikasjonen er fullført.");
        navigateToResultButton.style.display = "block";
        sameDeviceButton.style.display = "none";
        qrCode.style.display = "none";

        window.addEventListener("focus", redirect);
        document.addEventListener("visibilitychange", redirectWhenVisible);
    }

    const handle200 = async () => {
        if (!sameDeviceFlow) {
            debouncedRedirectToResultPage();
        }
        else {
            waitForUserBeforeRedirectToResultPage();
        }
    };

    const handle202 = (pollFunc, interval) => {
        if (stopped) {
            const resume = () => {
                window.removeEventListener("focus", resume);
                document.removeEventListener("visibilitychange", resumeWhenVisible);

                stopped = false;
                pollFunc();
            }
            const resumeWhenVisible = () => {
                if (document.visibilityState === "visible") {
                    resume();
                }
            };
            window.addEventListener("focus", resume);
            document.addEventListener("visibilitychange", resumeWhenVisible);
        }
        setTimeout(pollFunc, interval);
    }

    async function waitForWallet(interval, timeout) {
        const endtime = Date.now() + timeout;
        updateStatusMessage("Ventar på presentasjon frå wallet ...");

        async function poll() {
            if (Date.now() >= endtime) {
                updateStatusMessage("Tidsavbrot ved venting på verifisering.");
                return;
            }
            try {
                const response = await fetch(statusEndpoint, {
                    method: "GET",
                    headers: {Accept: "application/json"}
                });

                if (response.status === 200) {
                    await handle200();
                    return;
                }

                if (response.status === 202) {
                    handle202(poll, interval);
                    return;
                }

                if (response.status === 404) {
                    updateStatusMessage("Verifiseringa har ukjend status og blir stoppa.");
                    return;
                }

                updateStatusMessage("Klarte ikkje hente verifiseringsstatus.");

            } catch (error) {
                updateStatusMessage("Klarte ikkje hente verifiseringsstatus.");
            }
        }

        await poll();
    }

    waitForWallet(2000, 60000);
</script>
</body>
</html>
