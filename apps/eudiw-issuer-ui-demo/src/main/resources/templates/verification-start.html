<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn-no">
<head>
    <th:block th:replace="~{fragments/layout :: base_head_fragment}"></th:block>
    <title>Bevisgenerator</title>
</head>
<body>
<header th:replace="~{fragments/layout :: page_header_fragment}"></header>
<main>
   <div th:replace="~{fragments/components :: back_link_fragment(href='/')}"></div>
    <div>
        <h1 class="ds-heading" data-size="lg">
            Presenter bevis
        </h1>
    </div>
    <div th:replace="~{fragments/components :: stepper_fragment(steps=${steps}, currentStep=1)}"></div>
    <h2 class="ds-paragraph" data-size="lg">Vel ein bevistype og tilhøyrande attributt du ynkjer å henta fra ei lommebok</h2>

    <div>
        <p th:if="${verificationSuccessMessage}" class="ds-paragraph" style="color: #0f8f3c" th:text="${verificationSuccessMessage}"></p>

        <form class="form-container"
              th:action="@{/verification-start}"
              th:object="${verificationForm}"
              method="post">

            <div class="ds-field"
                 th:attr="x-data=|credentialPicker('${#strings.escapeJavaScript(verificationForm.credentialConfigurationId)}')|">
                <div class="credential-grid">
                    <template x-for="credential in credentials" :key="credential.id">
                        <div class="credential-card ds-card"
                             :class="{ 'credential-card--expanded': isSelected(credential.id) }"
                             role="button"
                             tabindex="0"
                             :aria-pressed="isSelected(credential.id)"
                             @click="select(credential.id)"
                             @keydown.enter.prevent="select(credential.id)"
                             @keydown.space.prevent="select(credential.id)">
                            <p class="ds-paragraph credential-card__title" data-weight="medium" x-text="credential.title"></p>

                            <div class="credential-card__claims" x-show="isSelected(credential.id)" @click.stop>
                                <template x-for="claim in credential.claims" :key="pathOf(claim)">
                                    <label class="credential-card__claim">
                                        <input type="checkbox"
                                               :checked="isClaimSelected(credential.id, claim)"
                                               @change="toggleClaim(credential.id, claim, $event.target.checked)">
                                        <span x-text="claim.label"></span>
                                    </label>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <input type="hidden" name="credentialConfigurationId" :value="selectedId">
                <template x-for="path in selectedClaimPaths" :key="path">
                    <input type="hidden" name="selectedClaimPaths" :value="path">
                </template>

                <span th:if="${#fields.hasErrors('credentialConfigurationId')}"
                      class="ds-validation-message"
                      th:errors="*{credentialConfigurationId}"></span>
                <span th:if="${#fields.hasErrors('selectedClaimPaths')}"
                      class="ds-validation-message"
                      th:errors="*{selectedClaimPaths}"></span>
            </div>

            <div class="button-group">
                <button class="ds-button"
                        type="submit"
                        data-variant="primary">
                    Start verifisering
                </button>
            </div>

        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: page_footer_fragment(issuer=${issuerUrl})}"></footer>
<script id="credential-definitions-data" type="application/json" th:utext="${credentialDefinitionsJson}"></script>
<script id="selected-claims-data" type="application/json" th:utext="${selectedClaimPathsJson}"></script>
<script>
    // Alpine.js component: holds all state for the credential card grid.
    // Cards are collapsed by default; selecting a card expands it and shows
    // its claims as checkboxes (all selected by default). Only the claims of
    // the currently selected card are submitted with the form.
    function credentialPicker(initialCredentialId) {
        const credentials = JSON.parse(document.getElementById("credential-definitions-data").textContent || "[]");
        const initialSelectedPaths = new Set(JSON.parse(document.getElementById("selected-claims-data").textContent || "[]"));

        function pathOf(claim) {
            return Array.isArray(claim.path) ? claim.path.join(".") : "";
        }

        const claimSelections = {};
        credentials.forEach((credential) => {
            const paths = (credential.claims || []).map(pathOf);
            const useInitialSelection = credential.id === initialCredentialId && initialSelectedPaths.size > 0;
            claimSelections[credential.id] = new Set(
                useInitialSelection ? paths.filter((path) => initialSelectedPaths.has(path)) : paths
            );
        });

        return {
            credentials,
            selectedId: initialCredentialId || "",
            claimSelections,

            select(id) {
                this.selectedId = id;
            },

            isSelected(id) {
                return this.selectedId === id;
            },

            pathOf,

            isClaimSelected(credentialId, claim) {
                return this.claimSelections[credentialId].has(pathOf(claim));
            },

            toggleClaim(credentialId, claim, checked) {
                const path = pathOf(claim);
                if (checked) {
                    this.claimSelections[credentialId].add(path);
                } else {
                    this.claimSelections[credentialId].delete(path);
                }
            },

            get selectedClaimPaths() {
                return this.selectedId ? Array.from(this.claimSelections[this.selectedId] ?? []) : [];
            }
        };
    }
</script>
</body>
</html>
