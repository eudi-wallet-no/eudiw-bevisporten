<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn-no">
<head>
    <th:block th:replace="~{fragments/general :: base_head_fragment}"></th:block>
    <title>Bevisgenerator</title>
</head>
<body>
<header th:replace="~{fragments/general :: page_header_fragment}"></header>
<main>
    <div style="max-width: 900px; padding-inline: var(--ds-size-7);">
        <h1 class="ds-heading" data-size="lg">
            Presenter bevis
        </h1>
    </div>
    <div class="ds-card" style="max-width: 900px">
        <h2 class="ds-heading" data-size="sm">Konfigurer DCQL query</h2>
        <p th:if="${verificationSuccessMessage}" class="ds-paragraph" style="color: #0f8f3c" th:text="${verificationSuccessMessage}"></p>
        <form class="form-container"
              th:action="@{/verification-start}"
              th:object="${verificationForm}"
              method="post">
            <div class="ds-field">
                <label for="credentialConfigurationId"
                       data-weight="medium"
                       class="ds-label">
                    Credential configuration
                </label>
                <select id="credentialConfigurationId"
                        class="ds-input"
                        th:field="*{credentialConfigurationId}"
                        th:attr="aria-invalid=${#fields.hasErrors('credentialConfigurationId')}">
                    <option value="">Velg</option>
                    <option th:each="credentialDefinition : ${credentialDefinitions}"
                            th:value="${credentialDefinition.id()}"
                            th:text="${credentialDefinition.title() + ' (' + credentialDefinition.id() + ')'}">
                    </option>
                </select>
                <span th:if="${#fields.hasErrors('credentialConfigurationId')}"
                      class="ds-validation-message"
                      th:errors="*{credentialConfigurationId}"></span>
            </div>
            <div class="ds-field">
                <label data-weight="medium" class="ds-label">
                    Claims
                </label>
                <div id="claims-container" class="ds-paragraph">Vel credential configuration for å sjå claims.</div>
                <span th:if="${#fields.hasErrors('selectedClaimPaths')}"
                      class="ds-validation-message"
                      th:errors="*{selectedClaimPaths}"></span>
            </div>
            <div class="button-group">
                <button class="ds-button"
                        type="submit"
                        data-variant="primary">
                    Start verifisering
                </button>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/general :: page_footer_fragment(issuer=${issuerUrl})}"></footer>
<script id="credential-definitions-data" type="application/json" th:utext="${credentialDefinitionsJson}"></script>
<script id="selected-claims-data" type="application/json" th:utext="${selectedClaimPathsJson}"></script>
<script>
    const definitions = JSON.parse(document.getElementById("credential-definitions-data").textContent || "[]");
    const selectedClaimPaths = new Set(JSON.parse(document.getElementById("selected-claims-data").textContent || "[]"));
    const configurationSelect = document.getElementById("credentialConfigurationId");
    const claimsContainer = document.getElementById("claims-container");

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll("\"", "&quot;")
            .replaceAll("'", "&#039;");
    }

    function getSelectedDefinition() {
        const selectedId = configurationSelect.value;
        return definitions.find(definition => definition.id === selectedId);
    }

    function renderClaims() {
        const selectedDefinition = getSelectedDefinition();
        if (!selectedDefinition) {
            claimsContainer.innerHTML = "Vel credential configuration for å sjå claims.";
            return;
        }
        if (!selectedDefinition.claims || selectedDefinition.claims.length === 0) {
            claimsContainer.innerHTML = "Ingen claims funne i credential definition.";
            return;
        }

        claimsContainer.innerHTML = selectedDefinition.claims
            .map((claim) => {
                const pathText = Array.isArray(claim.path) ? claim.path.join(".") : "";
                const checked = selectedClaimPaths.has(pathText);
                return `<label style="display:flex; align-items:center; gap: var(--ds-size-2); margin-bottom: var(--ds-size-2);">
                    <input type="checkbox" name="selectedClaimPaths" value="${escapeHtml(pathText)}"
                           ${checked ? "checked" : ""}>
                    <span>${escapeHtml(claim.label)} <span style="opacity:0.8">(${escapeHtml(pathText)})</span></span>
                </label>`;
            })
            .join("");
    }

    configurationSelect.addEventListener("change", renderClaims);
    renderClaims();
</script>
</body>
</html>
