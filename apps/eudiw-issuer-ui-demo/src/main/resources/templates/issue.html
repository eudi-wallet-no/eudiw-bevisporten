<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn-no">
<head>
    <th:block th:replace="~{fragments/layout :: base_head_fragment}"></th:block>
    <title>Bevisgenerator</title>
</head>

<body>
<header th:replace="~{fragments/layout :: page_header_fragment}"></header>

<main>
    <div class="landing-intro landing-copy">
        <h1 class="ds-heading" data-size="xl">
             Utsted bevis
        </h1>
        <p class="ds-paragraph" data-size="lg">
            Vel ein bevistype. Fyll deretter inn opplysningane som skal vere med i beviset.
        </p>
    </div>
    <div class="step-container">
        <th:block th:each="credentialConfiguration: ${credential_configurations}">
            <a th:href="@{/start-issuance/{id}(id = ${credentialConfiguration.credentialConfigurationId})}"
               class="ds-card"
               data-color="neutral"
               data-variant="default">
                <h2 class="ds-heading"
                    data-size="md"
                    th:text="${credentialConfiguration.description}">PID</h2>
            </a>
        </th:block>
    </div>
</main>

<footer th:replace="~{fragments/layout :: page_footer_fragment(issuer=${issuerUrl})}"></footer>
</body>
</html>
