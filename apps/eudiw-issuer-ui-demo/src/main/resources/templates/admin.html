<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn-no">
<head>
    <th:block th:replace="~{fragments/layout :: base_head_fragment}"></th:block>
    <title>Bevisgenerator</title>
</head>

<body>
<header th:replace="~{fragments/layout :: page_header_fragment}"></header>

<main>
    <div>
        <h1 class="ds-heading" data-size="lg">
            Administrer bevis
        </h1>
        <p class="ds-paragraph">
            Her kan du definere datamodell for en bevis-type. <br>Den må følge Openid4VCI-spec'en definisjoner for
            <a class="ds-link" th:href="@{https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-credential-issuer-metadata-p}">credential_metadata</a>.
        </p>
    </div>
    <div class="credential-table-wrapper">
        <table class="credential-table">
            <thead>
            <tr>
                <th>Beskrivelse</th>
                <th class="credential-table__actions-column">Handlinger</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${credentials}">
                <td th:text="${c.name()}">Navn</td>
                <td>
                    <div class="credential-table__actions">
                        <a class="ds-button"
                           data-size="sm"
                           data-variant="tertiary"
                           th:href="@{/edit-credential/{id}(id=${c.credentialType()})}">
                            Rediger
                        </a>
                        <a class="ds-button"
                           data-size="sm"
                           data-variant="tertiary"
                           th:href="@{/edit-credential-new/{id}(id=${c.credentialType()})}"
                           th:if="${allowBevisTyperV2}">
                            Rediger 2.0
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="admin-actions">
        <a class="ds-button" data-variant="neutral" data-size="lg" th:href="@{/add-credential}">
            + Legg til
        </a>
        <a class="ds-button" data-variant="neutral" data-size="lg" th:href="@{/add-credential-new}" th:if="${allowBevisTyperV2}">
            + Legg til 2.0
        </a>
    </div>

</main>

<footer th:replace="~{fragments/layout :: page_footer_fragment(issuer=${issuerUrl})}"></footer>

</body>
</html>
