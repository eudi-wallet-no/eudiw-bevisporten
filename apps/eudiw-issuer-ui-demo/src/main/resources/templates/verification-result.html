<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn-no">
<head>
    <th:block th:replace="~{fragments/layout :: base_head_fragment}"></th:block>
    <title>Resultat av verifikasjon | Bevisgenerator</title>
</head>
<body>
<header th:replace="~{fragments/layout :: page_header_fragment}"></header>
<main id="main-content" tabindex="-1">
    <div class="landing-intro landing-copy">
        <h1 class="ds-heading" data-size="xl">
            Resultat av verifikasjon
        </h1>
    </div>
    <div th:replace="~{fragments/components :: stepper_fragment(steps=${steps}, currentStep=3)}"></div>

    <div class="step-flow">
        <div class="step-flow__content" th:if="${result != null}">
            <div class="flex-container">
                <div class="ds-card verification-result__card"
                     data-color="neutral"
                     data-variant="default">
                    <h2 class="ds-heading" data-size="sm">Attributt</h2>

                    <div class="verification-result__group" th:each="credential : ${verificationResults}">
                        <p class="ds-label" th:text="${credential.displayName}"></p>

                        <dl class="verification-result__claims">
                            <div class="verification-result__claim" th:each="claim : ${credential.claims}">
                                <dt th:text="${claim.name}"></dt>
                                <dd th:text="${claim.value}"></dd>
                            </div>
                        </dl>
                    </div>
                </div>

                <div class="ds-card verification-result__card"
                     data-color="neutral"
                     data-variant="default">
                    <h2 class="ds-heading" data-size="sm">Valideringsdetaljar</h2>

                    <div class="verification-result__group" th:each="credential : ${verificationResults}">
                        <p class="ds-label" th:text="${credential.displayName}"></p>

                        <div class="verification-result__validation">
                            <p class="ds-alert"
                               th:data-color="${credential.valid} ? 'success' : 'danger'"
                               th:text="${credential.valid} ? 'Beviset er gyldig' : 'Beviset er ikkje gyldig'"></p>

                            <p class="ds-validation-message"
                               th:each="detail : ${credential.validationDetails}"
                               th:data-color="${detail.statusColor}"
                               th:text="${detail.typeLabel} + ': ' + ${detail.statusLabel}"></p>

                            <p class="ds-paragraph" data-size="sm" data-color="neutral"
                               th:if="${#lists.isEmpty(credential.validationDetails)}">
                                Ingen valideringsdetaljar tilgjengeleg.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="step-flow__content" th:if="${result == null}">
            <div class="ds-card content-narrow"
                 data-color="neutral"
                 data-variant="default">
                <p>Ingen resultat funne.</p>
            </div>
        </div>

        <div th:replace="~{fragments/components :: step_navigation_fragment(
            previousHref='/verification-start',
            previousLabel='Presenter nytt bevis',
            nextHref='/revoke',
            nextLabel='Tilbakekall bevis',
            nextForm=${null},
            nextDisabledUntilSelection=${false},
            dynamicNextForm=${false},
            nextColor=${null}
        )}"></div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: page_footer_fragment(issuer=${issuerUrl})}"></footer>
</body>
</html>
