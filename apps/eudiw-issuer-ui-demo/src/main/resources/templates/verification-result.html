<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn-no">
<head>
    <th:block th:replace="~{fragments/layout :: base_head_fragment}"></th:block>
    <title>Resultat av verifikasjon | Bevisgenerator</title>
    <script th:src="@{/js/image-claims.js}"></script>
</head>
<body>
<header th:replace="~{fragments/layout :: page_header_fragment}"></header>
<main id="main-content" tabindex="-1">
    <div class="landing-intro landing-copy">
        <h1 class="ds-heading" data-size="xl">
            Resultat av verifikasjon
        </h1>
    </div>
    <div th:replace="~{fragments/components :: stepper_fragment(steps=${steps}, currentStep=3)}"></div>

    <div class="step-flow">
        <div class="step-flow__content" th:if="${result != null}">
        <div class="ds-card content-narrow"
             data-color="neutral"
             data-variant="default"
             th:if="${#lists.isEmpty(verificationResults)}">
            <p>Ingen bevis vart overlevert i verifikasjonen.</p>
        </div>
        <div th:unless="${#lists.isEmpty(verificationResults)}"
             th:with="total=${#lists.size(verificationResults)},
                       validCount=${verificationResults.?[valid].size()},
                       allValid=${validCount > 0 and validCount == total}">
            <div class="ds-card verification-result__summary"
                 data-variant="default"
                 th:data-color="${allValid} ? 'success' : 'danger'">
                <div class="verification-result__summary-text">
                    <div class="verification-result__summary-title">
                        <span class="verification-result__summary-icon" aria-hidden="true">
                            <svg th:if="${allValid}"
                                 viewBox="0 0 24 24" fill="none">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                      d="M12 2.25C6.61522 2.25 2.25 6.61522 2.25 12C2.25 17.3848 6.61522 21.75 12 21.75C17.3848 21.75 21.75 17.3848 21.75 12C21.75 6.61522 17.3848 2.25 12 2.25ZM16.5725 9.48444C16.8401 9.16824 16.8007 8.695 16.4845 8.42745C16.1683 8.15989 15.695 8.19932 15.4275 8.51553L10.454 14.3933L8.03033 11.9697C7.73744 11.6768 7.26256 11.6768 6.96967 11.9697C6.67678 12.2625 6.67678 12.7374 6.96967 13.0303L9.96967 16.0303C10.118 16.1786 10.3216 16.2581 10.5312 16.2493C10.7407 16.2406 10.9371 16.1446 11.0725 15.9844L16.5725 9.48444Z"
                                      fill="currentColor"/>
                            </svg>
                            <svg th:if="${!allValid}"
                                 viewBox="0 0 24 24" fill="none">
                                <path d="M6.53033 5.46967C6.23744 5.17678 5.76256 5.17678 5.46967 5.46967C5.17678 5.76256 5.17678 6.23744 5.46967 6.53033L10.9393 12L5.46967 17.4697C5.17678 17.7626 5.17678 18.2374 5.46967 18.5303C5.76256 18.8232 6.23744 18.8232 6.53033 18.5303L12 13.0607L17.4697 18.5303C17.7626 18.8232 18.2374 18.8232 18.5303 18.5303C18.8232 18.2374 18.8232 17.7626 18.5303 17.4697L13.0607 12L18.5303 6.53033C18.8232 6.23744 18.8232 5.76256 18.5303 5.46967C18.2374 5.17678 17.7626 5.17678 17.4697 5.46967L12 10.9393L6.53033 5.46967Z"
                                      fill="currentColor"/>
                            </svg>
                        </span>
                        <h2 class="ds-heading" data-size="sm"
                            th:text="${allValid} ? ${total} + ' bevis delt og verifisert' : ${validCount} + ' av ' + ${total} + ' bevis verifisert'"></h2>
                        <span class="ds-tag"
                              th:data-color="${allValid} ? 'success' : 'danger'"
                              data-variant="outline"
                              th:text="${allValid} ? 'Vellykka' : 'Ugyldig'"></span>
                </div>
            </div>
        </div>

        <div class="verification-result__list">
            <article class="ds-card verification-result__item"
                     data-color="neutral"
                     data-variant="default"
                     th:each="credential, status : ${verificationResults}">
                <header class="ds-card__block verification-result__item-header">
                    <span class="verification-result__index"
                          aria-hidden="true"
                          th:text="${status.count}"></span>
                    <h2 class="ds-heading" data-size="sm"
                        th:text="${credential.displayName}"></h2>
                    <span class="ds-tag verification-result__item-status"
                          th:data-color="${credential.valid} ? 'success' : 'danger'"
                          data-variant="outline"
                          th:text="${credential.valid} ? 'Gyldig' : 'Ugyldig'"></span>
                </header>
                <div class="ds-card__block verification-result__item-body">
                    <div class="verification-result__column">
                        <h3 class="ds-heading verification-result__column-heading" data-size="2xs">Attributt</h3>
                        <div th:replace="~{fragments/components :: claim_list_fragment(claims=${credential.claims})}"></div>
                    </div>
                    <div class="verification-result__column">
                        <h3 class="ds-heading verification-result__column-heading" data-size="2xs">Valideringsdetaljar</h3>
                        <div class="verification-result__validation">
                            <div class="ds-alert"
                                 th:data-color="${credential.valid} ? 'success' : 'danger'"
                                 th:text="${credential.valid} ? 'Beviset er gyldig' : 'Beviset er ikkje gyldig'"></div>

                            <p class="ds-validation-message"
                               th:each="detail : ${credential.validationDetails}"
                               th:data-color="${detail.statusColor}"
                               th:text="${detail.validationDetails}"></p>

                            <p class="ds-paragraph" data-size="sm" data-color="neutral"
                               th:if="${#lists.isEmpty(credential.validationDetails)}">
                                Ingen valideringsdetaljar er tilgjengelege.
                            </p>
                        </div>
                    </div>
                </div>
            </article>
        </div>
        </div>

        <div class="step-flow__content" th:if="${result == null}">
            <div class="ds-card content-narrow"
                 data-color="neutral"
                 data-variant="default">
                <p>Fann ingen resultat.</p>
            </div>
        </div>

        <div th:replace="~{fragments/components :: step_navigation_fragment(
            previousHref='/verification-start',
            previousLabel='Presenter nytt bevis',
            nextHref='/revoke',
            nextLabel='Revoker bevis',
            nextForm=${null},
            nextDisabledUntilSelection=${false},
            dynamicNextForm=${false},
            nextColor=${null}
        )}"></div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: page_footer_fragment(issuer=${issuerUrl})}"></footer>
<script>
    document.querySelectorAll('.verification-result__claim-value').forEach(claimValue => {
        if (!imageClaims.isImageClaim(claimValue.dataset.claimName)) {
            return;
        }

        const image = document.createElement('img');
        image.src = imageClaims.dataUrl(claimValue.dataset.fullValue);
        image.alt = claimValue.previousElementSibling.textContent;
        image.className = 'verification-result__claim-image';
        claimValue.replaceChildren(image);
    });
</script>
</body>
</html>
