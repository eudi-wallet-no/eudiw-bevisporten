<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn-no">
<head>
    <th:block th:replace="~{fragments/layout :: base_head_fragment}"></th:block>
    <title>Intern feil</title>
</head>

<body>
<header th:replace="~{fragments/layout :: page_header_fragment}"></header>

<main>
    <div class="landing-intro landing-copy content-narrow">
        <h1 class="ds-heading"
            data-size="xl"
            th:text="${pageTitle ?: 'Vi kunne ikkje fullføre oppgåva'}">
            Vi kunne ikkje fullføre oppgåva
        </h1>
        <p class="ds-paragraph"
           data-size="lg"
           th:text="${userMessage ?: 'Prøv igjen. Dersom feilen held fram, kan du gå til forsida og starte på nytt.'}">
            Prøv igjen. Dersom feilen held fram, kan du gå til forsida og starte på nytt.
        </p>
    </div>

    <div class="error-content content-narrow">
        <div class="button-group">
            <a th:if="${recoveryHref != null}"
               th:href="@{${recoveryHref}}"
               class="ds-button"
               th:text="${recoveryLabel}">
                Start på nytt
            </a>
            <a th:href="@{/}"
               class="ds-button"
               th:attr="data-variant=${recoveryHref != null ? 'secondary' : 'primary'}">
                Gå til forsida
            </a>
        </div>

        <details class="ds-details" data-variant="default">
            <summary>Tekniske detaljar</summary>
            <div class="error-details">
                <code th:if="${statusCode != null}" th:text="${statusCode}"></code>
                <code th:if="${errorMessage != null}" th:text="${errorMessage}"></code>
                <code th:if="${details != null}" th:text="${details}"></code>
            </div>
        </details>
    </div>
</main>

<footer th:replace="~{fragments/layout :: page_footer_fragment(issuer=${issuerUrl})}"></footer>
</body>
</html>
