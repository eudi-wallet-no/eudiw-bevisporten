<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn-no">
<head>
    <th:block th:replace="~{fragments/layout :: base_head_fragment}"></th:block>
    <title>Rediger bevistype | Bevisgenerator</title>
</head>

<body>
<header th:replace="~{fragments/layout :: page_header_fragment}"></header>

<main id="main-content" tabindex="-1">
    <div class="landing-intro">
        <h1 class="ds-heading" data-size="xl">Rediger bevistype</h1>
    </div>

    <div class="content-narrow">
        <p class="ds-paragraph ds-alert">Det kan ta inntil ett minutt før bevistypen er tilgjengelig i utstederen.</p>
    </div>

    <form class="form-container"
          th:fragment="edit_attributes_form_fragment"
          id="edit_attributes_form"
          th:action="@{/edit-credential-new/{id}(id=*{credentialType()})}"
          th:object="${form}"
          method="post">

        <div class="ds-alert"
             data-color="danger"
             th:if="${#fields.hasAnyErrors()}">
            <p class="ds-paragraph" data-size="lg">Skjemaet inneheld feil:</p>
            <ul class="error-list">
                <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
            </ul>
        </div>

        <!-- Top metadata (no credentialType field in edit mode — it's fixed) -->
        <div class="metadata-fields">
            <div class="ds-field">
                <label for="name-field" class="ds-label">Bevisnavn</label>
                <input id="name-field" class="ds-input" type="text" th:field="*{name}" />
            </div>
            <!-- Format and scope are edited in JSON mode -->
            <input type="hidden" id="format-field" th:field="*{format}" />
            <input type="hidden" id="scope-field" th:field="*{scope}" />
        </div>


        <!-- Mode toggle -->
        <div class="mode-toggle" aria-label="Redigeringsmodus">
            <button class="ds-button mode-toggle__btn"
                    type="button"
                    data-mode-btn="schema"
                    aria-selected="true"
                    aria-controls="schema-panel"
                    onclick="switchMode('schema')">
                Skjema
            </button>
            <button class="ds-button mode-toggle__btn"
                    type="button"
                    data-mode-btn="json"
                    aria-selected="false"
                    aria-controls="json-panel"
                    onclick="switchMode('json')">
                Avansert
            </button>
        </div>

        <!-- Schema panel -->
        <div id="schema-panel">
            <div class="credential-editor">
                <!-- Left: presets + claims -->
                <div class="credential-editor__left">
                    <div class="preset-section">
                        <h2 class="ds-heading" data-size="sm">Legg til feltgrupper</h2>
                        <div class="preset-buttons">
                            <button class="ds-button"
                                    type="button"
                                    data-color="accent"
                                    data-variant="secondary"
                                    data-preset-btn="persondata"
                                    aria-pressed="false"
                                    onclick="togglePreset('persondata')">
                                + Persondata
                            </button>
                            <button class="ds-button"
                                    type="button"
                                    data-color="accent"
                                    data-variant="secondary"
                                    data-preset-btn="kontaktinfo"
                                    aria-pressed="false"
                                    onclick="togglePreset('kontaktinfo')">
                                + Kontaktinfo
                            </button>
                            <button class="ds-button"
                                    type="button"
                                    data-color="accent"
                                    data-variant="secondary"
                                    data-preset-btn="bilde"
                                    aria-pressed="false"
                                    onclick="togglePreset('bilde')">
                                + Bilde
                            </button>
                        </div>
                    </div>

                    <div class="claims-section">
                        <div id="claims" class="claims-list"></div>
                    </div>
                </div>

                <!-- Right: preview -->
                <div class="credential-editor__right">
                    <p class="ds-paragraph" data-size="sm" style="color: var(--ds-color-neutral-text-subtle); margin-block-end: var(--ds-size-2);">Førehandsvisning</p>
                    <div id="preview-panel" class="preview-card" role="img" aria-label="Bevis-forhåndsvisning">
                        <svg id="preview-spinner" class="ds-spinner preview-card__spinner" data-size="xs"
                             role="img" aria-label="Oppdaterer førehandsvisning"
                             viewBox="0 0 50 50" hidden>
                            <circle class="ds-spinner__background" cx="25" cy="25" r="20" fill="none" stroke-width="5"/>
                            <circle class="ds-spinner__circle" cx="25" cy="25" r="20" fill="none" stroke-width="5"/>
                        </svg>
                        <span class="preview-card__name" data-preview-name>Bevisnavn</span>
                        <div class="preview-card__body">
                            <div id="preview-portrait" class="preview-card__portrait" hidden>
                                <img id="preview-portrait-img" src="" alt="Profilbilde" />
                            </div>
                            <div class="preview-fields" data-preview-list></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- JSON panel -->
        <div id="json-panel" hidden>
            <div class="json-editor-wrapper">
                <h2 class="ds-heading" data-size="sm">JSON</h2>
                <textarea id="json-editor"
                          class="ds-input json-editor"
                          spellcheck="false"
                          aria-label="BYOB JSON"></textarea>
                <span id="json-badge" class="json-badge json-badge--invalid">✗ Ugyldig JSON</span>
            </div>
            
            <!-- Card design section -->
            <div class="json-design-section">
                <h3 class="ds-heading" data-size="xs">Utforming av kort</h3>
                <div class="color-controls">
                    <div class="color-control">
                        <label for="bg-color-input" class="ds-label">Bakgrunnsfarge</label>
                        <input type="color" id="bg-color-input" class="ds-input color-input" 
                               value="#ffffff" aria-label="Bakgrunnsfarge for bevis">
                    </div>
                    <div class="color-control">
                        <label for="text-color-input" class="ds-label">Tekstfarge</label>
                        <input type="color" id="text-color-input" class="ds-input color-input" 
                               value="#000000" aria-label="Tekstfarge for bevis">
                    </div>
                </div>
            </div>
        </div>

        <!-- Hidden field for JSON-mode submission -->
        <input type="hidden" name="rawJson" id="rawJson-input" />


        <button class="ds-button" type="submit" form="edit_attributes_form">Rediger bevistype</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: page_footer_fragment(issuer=${issuerUrl})}"></footer>
<script th:src="@{/js/credential-form.js}"></script>
<script type="application/json" id="credential-data" th:utext="${credentialJson}"></script>
</body>
</html>
