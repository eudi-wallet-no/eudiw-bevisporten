---
spring:
  application:
    environment: test

bevisgenerator:
  features:
    allow-bevistyper-v2: true
    revocation-v2-rich-result: true
  issuer-server:
    credential-issuer: ${bevisgenerator.issuer-server.base-url}/bevisgenerator
    credential-issuer-pid: ${bevisgenerator.issuer-server.base-url}/pid
    credential-issuer-minid: ${bevisgenerator.issuer-server.base-url}/minid
    credential-issuer-webuild: ${bevisgenerator.issuer-server.base-url}/webuild
    well-known-urls:
      - ${bevisgenerator.issuer-server.base-url}/.well-known/openid-credential-issuer/pid
      - ${bevisgenerator.issuer-server.base-url}/.well-known/openid-credential-issuer/minid
      - ${bevisgenerator.issuer-server.base-url}/.well-known/openid-credential-issuer/bevisgenerator
      - ${bevisgenerator.issuer-server.base-url}/.well-known/openid-credential-issuer/webuild
    subject-credential-configurations:
      webuild_pid_mso_mdoc:
        credential-configuration-id: no.digdir.eudiw.webuild.pid_mso_mdoc
        credential-issuer: ${bevisgenerator.issuer-server.credential-issuer-webuild}
        description: Norsk ID-bevis WeBuild (mdoc)
        scope: eudiw:no:pid
      webuild_pid_sd_jwt_vc:
        credential-configuration-id: no.digdir.eudiw.webuild.pid_sd_jwt_vc
        credential-issuer: ${bevisgenerator.issuer-server.credential-issuer-webuild}
        description: Norsk ID-bevis WeBuild (SD-JWT VC)
        scope: eudiw:no:pid

maskinporten:
  lib:
    issuer: https://test.maskinporten.no/
