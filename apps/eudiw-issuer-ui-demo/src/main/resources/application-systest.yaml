---
spring:
  application:
    environment: systest

bevisgenerator:
  features:
    revocation-v2-rich-result: true
  byob-service:
    base-url: https://byob-service.eidas2sandkasse.dev
  issuer-server:
    credential-issuer: https://utsteder.eidas2sandkasse.dev/bevisgenerator
    credential-issuer-pid: https://utsteder.eidas2sandkasse.dev/pid
    credential-issuer-minid: https://utsteder.eidas2sandkasse.dev/minid
    # PID bruker kun authorization code flow i systest og kan ikke utstedes via denne pre-authorized UI-en
    excluded-credential-configurations:
      - pid-mdoc-push
    well-known-urls:
      - https://utsteder.eidas2sandkasse.dev/.well-known/openid-credential-issuer/pid
      - https://utsteder.eidas2sandkasse.dev/.well-known/openid-credential-issuer/minid
      - https://utsteder.eidas2sandkasse.dev/.well-known/openid-credential-issuer/bevisgenerator
  verifier-service:
    base-url: https://verifier-service.eidas2sandkasse.dev

maskinporten:
  lib:
    issuer: https://test.maskinporten.no/
