---
spring:
  application:
    environment: systest

bevisgenerator:
  features:
    revocation-v2-rich-result: true
  issuer-server:
    credential-issuer: ${bevisgenerator.issuer-server.base-url}/bevisgenerator
    credential-issuer-pid: ${bevisgenerator.issuer-server.base-url}/pid
    credential-issuer-minid: ${bevisgenerator.issuer-server.base-url}/minid
    well-known-urls:
      - ${bevisgenerator.issuer-server.base-url}/.well-known/openid-credential-issuer/pid
      - ${bevisgenerator.issuer-server.base-url}/.well-known/openid-credential-issuer/minid
      - ${bevisgenerator.issuer-server.base-url}/.well-known/openid-credential-issuer/bevisgenerator

maskinporten:
  lib:
    issuer: https://test.maskinporten.no/
