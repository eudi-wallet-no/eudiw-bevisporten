---
server:
  port: 8080
  servlet:
    context-path: /
    session:
      tracking-modes:
        - cookie
      cookie:
        same-site: lax
        secure: true
        name: ${spring.application.name}-session
      timeout: 30m

# Spring Boot Actuator
management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: info,version,prometheus,health
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.application.environment}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: digital-lommebok-idporten-login
    environment: default
  session:
    store-type: redis
    redis:
      namespace: "${spring.application.name}:session"
  cache:
    type: redis
  data:
    redis:
      timeout: 3s
      connect-timeout: 3s

# Digdir standard logging
digdir:
  access:
    logging:
      debug-level: request
      filtering:
        static-resources: true
  audit:
    log-dir:
    log-file:
    application-name: ${spring.application.name}
    application-environment: ${spring.application.environment}
    filters:
      admin-header: false
      bearer-token: false
      correlation-id: false
      ip-address: true
    prometheus:
      counter: true

# Application config
eudiw-idporten-login:
  oidc-sdk:
    issuer:
    keystore:
      type: auto
    par-lifetime-seconds: 60
    authorization-lifetime-seconds: 60
    response-modes-supported:
      - query
      - query.jwt
    scopes-supported:
      - openid
    acr-values:
      - idporten-loa-substantial
      - idporten-loa-high
    ui-locales:
      - nb
    clients:


idporten-key-manager:
  keystores:
    openid4vp:
      key-store-type: ${SIOP2_KEYSTORE_TYPE}
      key-store-location: ${SIOP2_KEYSTORE_LOCATION}
      key-store-password: ${SIOP2_KEYSTORE_PASSWORD}
      key-alias: ${SIOP2_KEYSTORE_KEY_ALIAS}
      key-password: ${SIOP2_KEYSTORE_KEY_PASSWORD}

---
spring:
  config:
    activate:
      on-cloud-platform: 'kubernetes'
    import:
      - 'optional:file:/etc/config/'
