---
spring:
  application:
    environment: test
  data:
    redis:
      password: ${REDIS_PASSWORD}
      sentinel:
        master: mymaster
        password: ${REDIS_PASSWORD}
        nodes:
          - digital-lommebok-redis-ha-server-0.digital-lommebok-redis-ha:26379
          - digital-lommebok-redis-ha-server-1.digital-lommebok-redis-ha:26379
          - digital-lommebok-redis-ha-server-2.digital-lommebok-redis-ha:26379

eudiw-idporten-login:
  features:
    allow-synthetic-person-identifiers: true
    allow-real-person-identifiers: false
  oidc-sdk:
    issuer: https://idporten-login.test.eidas2sandkasse.net/
    clients:
      - client-id: idporten
        client-secret: ${IDPORTEN_CLIENT_SECRET}
        scopes:
          - openid
        redirect-uris:
          - https://login.test.idporten.no/authorize/callback/eudiw
