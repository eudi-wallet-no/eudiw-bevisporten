---
spring:
  application:
    environment: test

  data:
    redis:
      password: ${REDIS_PASSWORD}
      sentinel:
        master: mymaster
        password: ${REDIS_PASSWORD}
        nodes:
          - digital-lommebok-redis-ha-server-0.digital-lommebok-redis-ha:26379
          - digital-lommebok-redis-ha-server-1.digital-lommebok-redis-ha:26379
          - digital-lommebok-redis-ha-server-2.digital-lommebok-redis-ha:26379

verifier-service:
  siop2-client-id: verifier-service.test.eidas2sandkasse.net
  external-base-uri: https://verifier-service.test.eidas2sandkasse.net
  client-applications:
    idporten-login:
      keystore-name: idporten-login-access
      api-key: ${IDPORTEN_LOGIN_API_KEY:}
    bevisgenerator-login:
      keystore-name: bevisgenerator-login-access
      api-key: ${BEVISGENERATOR_LOGIN_API_KEY:}
    ks-hackathon:
      keystore-name: ks-hackathon-access
      disabled: true
      api-key: ${KS_HACKATHON_API_KEY:}
    minid:
      keystore-name: minid-login-access
      api-key: ${MINID_LOGIN_API_KEY}


idporten-key-manager:
  keystores:
    idporten-login-access:
      key-store-type: ${IDPORTEN_LOGIN_ACCESS_KEYSTORE_TYPE}
      key-store-location: ${IDPORTEN_LOGIN_ACCESS_KEYSTORE_LOCATION}
      key-store-password: ${IDPORTEN_LOGIN_ACCESS_KEYSTORE_PASSWORD}
      key-alias: ${IDPORTEN_LOGIN_ACCESS_KEY_ALIAS}
      key-password: ${IDPORTEN_LOGIN_ACCESS_KEY_PASSWORD}
    bevisgenerator-login-access:
      key-store-type: ${BEVISGENERATOR_LOGIN_ACCESS_KEYSTORE_TYPE}
      key-store-location: ${BEVISGENERATOR_LOGIN_ACCESS_KEYSTORE_LOCATION}
      key-store-password: ${BEVISGENERATOR_LOGIN_ACCESS_KEYSTORE_PASSWORD}
      key-alias: ${BEVISGENERATOR_LOGIN_ACCESS_KEY_ALIAS}
      key-password: ${BEVISGENERATOR_LOGIN_ACCESS_KEY_PASSWORD}
    ks-hackathon-access:
      key-store-type: ${KS_HACKATHON_ACCESS_KEYSTORE_TYPE}
      key-store-location: ${KS_HACKATHON_ACCESS_KEYSTORE_LOCATION}
      key-store-password: ${KS_HACKATHON_ACCESS_KEYSTORE_PASSWORD}
      key-alias: ${KS_HACKATHON_ACCESS_KEY_ALIAS}
      key-password: ${KS_HACKATHON_ACCESS_KEY_PASSWORD}
    minid-login-access:
      key-store-type: ${MINID_LOGIN_ACCESS_KEYSTORE_TYPE}
      key-store-location: ${MINID_LOGIN_ACCESS_KEYSTORE_LOCATION}
      key-store-password: ${MINID_LOGIN_ACCESS_KEYSTORE_PASSWORD}
      key-alias: ${MINID_LOGIN_ACCESS_KEY_ALIAS}
      key-password: ${MINID_LOGIN_ACCESS_KEY_PASSWORD}

trustlists:
  connect-timeout: 3s
  read-timeout: 3s
  issuer-trustlists:
    "[https://utsteder.test.eidas2sandkasse.net/pid]": https://tillitsliste.test.eidas2sandkasse.net/no_eidas2sandkasse_test_pid.jws
    "[https://utsteder.test.eidas2sandkasse.net/webuild]": https://trustlist.webuild.jwt
    default: https://tillitsliste.test.eidas2sandkasse.net/no_eidas2sandkasse_test_tsl.xtsl
  named-trustlists:
    "[eidas2sandkasse-pid]": https://tillitsliste.test.eidas2sandkasse.net/no_eidas2sandkasse_test_pid.jws
    "[webuild-pid]": https://trustlist.webuild.jwt
    "[eidas2sandkasse.xtsl]": https://tillitsliste.test.eidas2sandkasse.net/no_eidas2sandkasse_test_tsl.xtsl
  pid:
    - eidas2sandkasse-pid
    - webuild-pid
  attestations:
    - eidas2sandkasse.xtsl