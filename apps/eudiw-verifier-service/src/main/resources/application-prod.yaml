---
spring:
  application:
    environment: prod

verifier-service:
  siop2-client-id: verifier-service.eidas2sandkasse.no
  external-base-uri: https://verifier-service.eidas2sandkasse.no

trustlists:
  connect-timeout: 3s
  read-timeout: 3s
  named-trustlists:
    "[eidas2sandkasse-pid]":
      url: https://tillitsliste.eidas2sandkasse.net/no_eidas2sandkasse_prod_pid.jws
      encoding: json
    "[eidas2sandkasse.xtsl]":
      url: https://tillitsliste.eidas2sandkasse.net/no_eidas2sandkasse_prod_tsl.xtsl
  pid:
    - eidas2sandkasse-pid
  attestations:
    - eidas2sandkasse.xtsl