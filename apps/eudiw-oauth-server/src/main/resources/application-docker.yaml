---
server:
  port: 9260
  servlet:
    session:
      cookie:
        secure: false

management:
  server:
    port: 9261
  endpoint:
    health:
      show-details: always

spring:
  application:
    environment: docker
  data:
    redis:
      port: 6379
      host: redis

# EUDIW auth server
oauth-authorization-server:
  issuer: http://oauth-server:9260
#  issuer: http://localhost:9260

oidc-proxy:
  redirect-uri: ${oauth-authorization-server.issuer}/callback
  oidc-issuer:
    issuer: https://idporten.dev
    authorization-endpoint: https://login.idporten.dev/authorize
