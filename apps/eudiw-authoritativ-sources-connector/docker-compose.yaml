name: digital-lommebok-issuer
networks:
  digital-lommebok:
    name: digital-lommebok

services:

  authoritativ-sources-connector:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        GIT_PACKAGE_TOKEN: ${GIT_PACKAGE_TOKEN}
        GIT_PACKAGE_USERNAME: ${GIT_PACKAGE_USERNAME}
    environment:
      spring_profiles_active: docker
      _JAVA_OPTIONS: "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
    ports:
      - "9298:9298"
      - "9299:9299"
    networks:
      - digital-lommebok
    entrypoint: "/bin/bash -c"
    command:
      - |
        java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9299 -jar application.jar
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9298/health/readiness || exit 1
      interval: 15s
      start_period: 5s
      timeout: 5s
      retries: 20

