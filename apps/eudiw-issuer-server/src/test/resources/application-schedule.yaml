---
spring:
  application:
    environment: schedule

credential-issuer-server:
  credential-issuer: https://schedule.eidas2sandkasse.dev/
  authorization-servers:
    - issuer: https://schedule.idporten.no
      jwks-uri: https://schedule.idporten.no/jwks.json
      api-key: schedule-key
  cryptographic-bindings:
    - jwk
  formats:
    - mso_mdoc
  credential-configurations:
    - identifier: junitdoc_mso_mdoc
      scope: eudiw:junit
      format: mso_mdoc
      credential-type: junitdoc
      claims-source-uri: class://no.idporten.eudiw.issuer.authoritativesources.JUnitClaimsSource
      grant-type: authorization_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      key-store-name: eaa-provider

  dynamic-credential-configuration-template:
    grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
    authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
    pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
    key-store-name: eaa-provider

  claims-sources:
    - credential-types:
        - eidas2sandkasse.wildcard_sd_jwt_vc
      class-name: no.idporten.eudiw.issuer.claimssource.byob.ByobClaimsSource

maskinporten:
  lib:
    issuer: https://dummy-maskinporten.no/
    clients:
      freg:
        client-id: client-id
        kid: my-kid
      advokatregisteret:
        client-id: client-id
        kid: my-kid
      krr:
        client-id: client-id
        kid: my-kid
      inntektsapi:
        client-id: client-id
        kid: my-kid

idporten-key-manager:
  keystores:
    eaa-provider:
      key-store-type: pkcs12
      key-store-location: base64:
      key-store-password: changeit
      key-alias: eudiw-issuer
      key-password: changeit
    maskinporten-freg:
      key-store-type: JKS
      key-store-location: base64:
      key-store-password: changeit
      key-alias: freg-eudiw-maskinporten-dev
      key-password: changeit
    maskinporten-advokatregisteret:
      key-store-type: JKS
      key-store-location: base64:
      key-store-password: changeit
      key-alias: freg-eudiw-maskinporten-dev
      key-password: changeit
    maskinporten-krr:
      key-store-type: JKS
      key-store-location: base64:
      key-store-password: idFoMz[nt{|0,2^@etJr
      key-alias: freg-eudiw-maskinporten-test
      key-password: idFoMz[nt{|0,2^@etJr
    maskinporten-inntektsapi:
      key-store-type: JKS
      key-store-location: base64:
      key-store-password: changeit
      key-alias: freg-eudiw-maskinporten-dev
      key-password: changeit
