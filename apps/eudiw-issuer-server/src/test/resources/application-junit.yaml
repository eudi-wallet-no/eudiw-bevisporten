---
spring:
  application:
    environment: junit
  datasource:
    type: org.springframework.jdbc.datasource.SimpleDriverDataSource
    url: "jdbc:h2:mem:issuer_junit;MODE=MySQL;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: junit
    password: junit
  flyway:
    locations: classpath:/db/migration

credential-issuer-server:
  features:
    revocation-result-endpoint:
      enabled: true
  credential-issuer: https://junit.eidas2sandkasse.dev
  authorization-servers:
    - id: junit
      issuer: https://junit.idporten.no
      jwks-uri: https://junit.idporten.no/jwks.json
      internal-api:
        uri: https://junit.idporten.no
        api-key-header: X-API-KEY
        api-key: junit-key
    - id: junit-invalid
      issuer: https://junit-invalid.idporten.no
      jwks-uri: https://junit-invalid.idporten.no/jwks.json
      internal-api:
        uri: https://junit-invalid.idporten.no
        api-key-header: X-API-KEY
        api-key: junit-key
  cryptographic-bindings:
    - jwk
  tenants:
    root:
      display-names:
        "no": Root Tenant
      credential-configuration-sources-properties:
        - local:
            paths:
              - classpath:credential-configurations/junit_mso_mdoc.json
              - classpath:credential-configurations/junit_sd_jwt_vc.json
              - classpath:credential-configurations/junit_pre_mso_mdoc.json
              - classpath:credential-configurations/junit_pre_sd_jwt_vc.json
    junit:
      batch-size: 5
      display-names:
        "no": Junit Tenant
      credential-configuration-sources-properties:
        - local:
            paths:
              - classpath:credential-configurations/junit_pre_sd_jwt_vc.json

idporten-key-manager:
  keystores:
    eaa-provider:
      key-store-type: pkcs12
      key-store-location: base64:
      key-store-password: changeit
      key-alias: eudiw-issuer
      key-password: changeit
