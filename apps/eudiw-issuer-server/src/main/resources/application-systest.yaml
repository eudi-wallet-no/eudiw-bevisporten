---
spring:
  application:
    environment: systest
  data:
    redis:
      password: ${REDIS_PASSWORD}
      sentinel:
        master: mymaster
        password: ${REDIS_PASSWORD}
        nodes:
          - digital-lommebok-redis-ha-server-0.digital-lommebok-redis-ha:26379
          - digital-lommebok-redis-ha-server-1.digital-lommebok-redis-ha:26379
          - digital-lommebok-redis-ha-server-2.digital-lommebok-redis-ha:26379

credential-issuer-server:
  credential-issuer: https://utsteder.eidas2sandkasse.dev
  authorization-servers:
    - id: auth-eidas2sandkasse
      issuer: https://auth.eidas2sandkasse.dev
      jwks-uri: http://digital-lommebok-oauth-server-service:8080/jwks
      api-key: ${AUTH_PROXY_API_KEY}
  pre-authorization-servers:
    - id: maskinporten
      issuer: https://test.maskinporten.no/
      jwks-uri: https://test.maskinporten.no/jwk
  # midlertidige tenants som brukes under utvikling og testing av multi-tenancy
  tenants:
    bevisgenerator:
      display-names:
        "no": "Bevisgenerator"
      credential-configuration-sources-properties:
        - uri: ${byob-service.uri}
          api-key: ${byob-service.api-key}
          connect-timeout: 2s
          read-timeout: 2s
          cache-ttl: 28s
    pid:
      display-names:
        "no": "PID-utsteder"
      credential-configuration-sources-properties:
        - uri: classpath:credential-configurations/pid/pid_mso_mdoc.json
        - uri: classpath:credential-configurations/pid/pid_sd_jwt_vc.json
