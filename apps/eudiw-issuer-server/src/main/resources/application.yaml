---
server:
  port: 8080

spring:
  thread-executor: virtual
  application:
    name: digital-lommebok-issuer-server
    environment: default
  data:
    redis:
      timeout: 3s
      connect-timeout: 3s

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: info,version,prometheus,health
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.application.environment}

credential-issuer-server:
  cryptographic-bindings:
    - jwk
  proof-signing-algorithms:
    - ES256
  credential-signing-algorithms:
    - ES256
  formats:
    - mso_mdoc
  credential-configurations:
    - identifier: no.digdir.eudiw.pid_mso_mdoc
      scope: eudiw:no:pid
      format: mso_mdoc
      credential-type: eu.europa.ec.eudi.pid.1
      grant-type: authorization_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      key-store-name: pid-provider
    - identifier: no.digdir.eudiw.pid_sd_jwt_vc
      scope: eudiw:no:pid
      format: sd_jwt_vc
      credential-type: urn:eudi:pid:1
      grant-type: authorization_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      key-store-name: pid-provider
    - identifier: no.skatteetaten.nnid_mso_mdoc
      scope: eudiw:no:skatteetaten:nnid
      format: mso_mdoc
      credential-type: no.skatteetaten.nnid.1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
      key-store-name: eaa-provider
    - identifier: no.advokattilsynet.advokatregisteret_mso_mdoc
      scope: eudiw:no:advokattilsynet:advokatregisteret
      format: mso_mdoc
      credential-type: no.advokattilsynet.advokatregisteret.1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
      key-store-name: eaa-provider
    - identifier: no.minid.mpid_sd_jwt_vc
      scope: eudiw:no:minid:mpid
      format: sd_jwt_vc
      credential-type: no:minid:mpid:1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
      require-tx-code: false
      key-store-name: eaa-provider
    - identifier: no.kontaktregisteret.kontaktinformasjon_sd_jwt_vc
      scope: eudiw:no:kontaktregisteret:kontaktinformasjon
      format: sd_jwt_vc
      credential-type: no:kontaktregisteret:kontaktinformasjon:1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
      key-store-name: eaa-provider
    - identifier: org.iso.18013.5.1.mDL_mso_mdoc
      scope: eudiw:no:vegvesen:mdl
      format: mso_mdoc
      credential-type: org.iso.18013.5.1.mDL:1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
      key-store-name: eaa-provider
    - identifier: proof_of_age
      scope: proof_of_age
      format: mso_mdoc
      credential-type: eu.europa.ec.av.1
      validity-days: 30
      grant-type: authorization_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      key-store-name: eaa-provider
    - identifier: no.skatteetaten.inntekt_sd_jwt_vc
      scope: eudiw:no:skatteetaten:inntekt
      format: sd_jwt_vc
      credential-type: no.skatteetaten.inntekt.1
      validity-days: 180
      grant-type: authorization_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      key-store-name: eaa-provider
    - identifier: no.kommunalsektor.hcregister_mso_mdoc
      scope: eudiw:no:kommunalsektor:hcregister
      format: mso_mdoc
      credential-type: no:kommunalsektor:hcregister:1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
      key-store-name: eaa-provider
    - identifier: no.helsesektor.legeerklaring_mso_mdoc
      scope: eudiw:no:helsesektor:legeerklaring
      format: mso_mdoc
      credential-type: no:helsesektor:legeerklaring:1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
      key-store-name: eaa-provider

  claims-sources:
    - credential-types:
        - eu.europa.ec.eudi.pid.1
      class-name: no.idporten.eudiw.issuer.claimssource.pid.PIDMdocClaimsSource
    - credential-types:
        - urn:eudi:pid:1
      class-name: no.idporten.eudiw.issuer.claimssource.pid.PIDSDJwtClaimsSource
    - credential-types:
        - no.skatteetaten.nnid.1
      class-name: no.idporten.eudiw.issuer.claimssource.skatteetaten.NnidClaimsSource
    - credential-types:
        - no.advokattilsynet.advokatregisteret.1
      class-name: no.idporten.eudiw.issuer.claimssource.advokattilsynet.AdvokatregisteretClaimsSource
    - credential-types:
        - no:minid:mpid:1
      class-name: no.idporten.eudiw.issuer.claimssource.minid.MpidClaimsSource
    - credential-types:
        - no:kontaktregisteret:kontaktinformasjon:1
      class-name: no.idporten.eudiw.issuer.claimssource.krr.KrrClaimsSource
    - credential-types:
        - org.iso.18013.5.1.mDL:1
      class-name: no.idporten.eudiw.issuer.claimssource.vegvesenet.ForerkortClaimsSource
    - credential-types:
        - eu.europa.ec.av.1
      class-name: no.idporten.eudiw.issuer.claimssource.ageverification.AgeVerificationClaimsSource
    - credential-types:
        - no.skatteetaten.inntekt.1
      class-name: no.idporten.eudiw.issuer.claimssource.skatteetaten.InntektClaimsSource
    - credential-types:
        - no:kommunalsektor:hcregister:1
      class-name: no.idporten.eudiw.issuer.claimssource.kommune.HandicapBevisClaimsSource
    - credential-types:
        - no:helsesektor:legeerklaring:1
      class-name: no.idporten.eudiw.issuer.claimssource.helsesektor.LegeerklaringBevisClaimsSource

# Digdir standard logging
digdir:
  audit:
    application-name:  ${spring.application.name}    # recommended naming convention is groupId:artifactId
    application-environment: ${spring.application.environment}
    filters:
      admin-header: false                                     # optional - default 'true'
      bearer-token: false                                    # optional - default 'true'
      ip-address: true                                    # optional - default 'true'
    prometheus:
      counter: false                                     # optional - default 'true'
  ## Eventlogging
  event:
    logging:
      feature-enabled: false

## Folkeregister integration
freg:
  uri: https://folkeregisteret-api-konsument.sits.no/folkeregisteret/offentlig-med-hjemmel/api/
  #uri: https://folkeregisteret.api.skatteetaten.no/folkeregisteret/offentlig-med-hjemmel/api # Prod
  connect-timeout: 5s
  read-timeout: 5s

## Data.altinn.no for advokatbevis
advoktatregisteret:
  uri: https://test-api.data.altinn.no/v1/directharvest/AdvRegPersonPrivat/
  subscription-key: ${ADVOKATREGISTERET_SUBSCRIPTION_KEY}
  scope: altinn:dataaltinnno/advregpersonprivat
  connect-timeout: 5s
  read-timeout: 5s

## KRR
krr:
  uri: https://test.kontaktregisteret.no/
  scope: krr:global/kontaktinformasjon.read
  connect-timeout: 2s
  read-timeout: 2s

## Inntektsapi fra Skatteetaten
inntektsapi:
  uri: https://inntekt.api.skatteetaten-test.no/
  scope: skatteetaten:inntekt
  connect-timeout: 2s
  read-timeout: 2s

# Maskinporten
maskinporten:
  lib:
    enabled: true
    issuer: dummy
    clients:
      freg:
        client-id: ${MASKINPORTEN_CLIENT_ID}
        kid: ${MASKINPORTEN_CLIENT_KID}
        issuer: ${maskinporten.lib.issuer}
        audience:
          - ${maskinporten.lib.issuer}
        token-endpoint: ${maskinporten.lib.issuer}token
        scope: folkeregister:deling/offentligmedhjemmel
        connect-timeout-ms: 5000
        read-timeout-ms: 2000
        key-store-name: maskinporten-freg
      krr:
        client-id: ${MASKINPORTEN_CLIENT_ID}
        kid: ${MASKINPORTEN_CLIENT_KID}
        issuer: ${maskinporten.lib.issuer}
        audience:
          - ${maskinporten.lib.issuer}
        token-endpoint: ${maskinporten.lib.issuer}token
        scope: krr:global/kontaktinformasjon.read krr:global/digitalpost.read
        connect-timeout-ms: 5000
        read-timeout-ms: 2000
        key-store-name: maskinporten-krr
      advokatregisteret:
        client-id: ${MASKINPORTEN_CLIENT_ID}
        kid: ${MASKINPORTEN_CLIENT_KID}
        issuer: ${maskinporten.lib.issuer}
        audience:
          - ${maskinporten.lib.issuer}
        token-endpoint: ${maskinporten.lib.issuer}token
        scope: altinn:dataaltinnno/advregpersonprivat
        connect-timeout-ms: 5000
        read-timeout-ms: 2000
        key-store-name: maskinporten-advokatregisteret
      inntektsapi:
        client-id: ${MASKINPORTEN_CLIENT_ID}
        kid: ${MASKINPORTEN_CLIENT_KID}
        issuer: ${maskinporten.lib.issuer}
        audience:
          - ${maskinporten.lib.issuer}
        token-endpoint: ${maskinporten.lib.issuer}token
        scope: skatteetaten:inntekt
        connect-timeout-ms: 2000
        read-timeout-ms: 2000
        key-store-name: maskinporten-inntektsapi
idporten-key-manager:
  keystores:
    pid-provider:
      key-store-type: ${PID_PROVIDER_KEYSTORE_TYPE}
      key-store-location: ${PID_PROVIDER_KEYSTORE_LOCATION}
      key-store-password: ${PID_PROVIDER_KEYSTORE_PASSWORD}
      key-alias: ${PID_PROVIDER_KEYSTORE_KEY_ALIAS}
      key-password: ${PID_PROVIDER_KEYSTORE_KEY_PASSWORD}
    eaa-provider:
      key-store-type: ${EAA_PROVIDER_KEYSTORE_TYPE}
      key-store-location: ${EAA_PROVIDER_KEYSTORE_LOCATION}
      key-store-password: ${EAA_PROVIDER_KEYSTORE_PASSWORD}
      key-alias: ${EAA_PROVIDER_KEYSTORE_KEY_ALIAS}
      key-password: ${EAA_PROVIDER_KEYSTORE_KEY_PASSWORD}
    maskinporten-freg:
      key-store-type: JKS
      key-store-location: base64:${MASKINPORTEN_BASE64_KEYSTORE}
      key-store-password: ${MASKINPORTEN_KEYSTORE_PASSWORD}
      key-alias: ${MASKINPORTEN_KEYSTORE_ALIAS}
      key-password: ${MASKINPORTEN_KEY_PASSWORD}
    maskinporten-advokatregisteret:
      key-store-type: JKS
      key-store-location: base64:${MASKINPORTEN_BASE64_KEYSTORE}
      key-store-password: ${MASKINPORTEN_KEYSTORE_PASSWORD}
      key-alias: ${MASKINPORTEN_KEYSTORE_ALIAS}
      key-password: ${MASKINPORTEN_KEY_PASSWORD}
    maskinporten-inntektsapi:
      key-store-type: JKS
      key-store-location: base64:${MASKINPORTEN_BASE64_KEYSTORE}
      key-store-password: ${MASKINPORTEN_KEYSTORE_PASSWORD}
      key-alias: ${MASKINPORTEN_KEYSTORE_ALIAS}
      key-password: ${MASKINPORTEN_KEY_PASSWORD}
    maskinporten-krr:
      key-store-type: JKS
      key-store-location: base64:${MASKINPORTEN_BASE64_KEYSTORE}
      key-store-password: ${MASKINPORTEN_KEYSTORE_PASSWORD}
      key-alias: ${MASKINPORTEN_KEYSTORE_ALIAS}
      key-password: ${MASKINPORTEN_KEY_PASSWORD}
