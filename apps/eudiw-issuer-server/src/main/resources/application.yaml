---
server:
  port: 8080

spring:
  thread-executor: virtual
  application:
    name: digital-lommebok-issuer-server
    environment: default

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: info,version,prometheus,health
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.application.environment}

credential-issuer-server:
  cryptographic-bindings:
    - jwk
  proof-signing-algorithms:
    - ES256
  formats:
    - mso_mdoc
  credential-configurations:
    - identifier: no.digdir.eudiw.pid_mso_mdoc
      scope: nobid:pid
      format: mso_mdoc
      doctype: eu.europa.ec.eudi.pid.1
      grant-type: authorization_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
    - identifier: no.skatteetaten.nnid_mso_mdoc
      scope: eudiw:no:skatteetaten:nnid
      format: mso_mdoc
      doctype: no.skatteetaten.nnid.1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
    - identifier: no.advokattilsynet.advokatregisteret_mso_mdoc
      scope: eudiw:no:advokattilsynet:advokatregisteret
      format: mso_mdoc
      doctype: no.advokattilsynet.advokatregisteret.1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
    - identifier: no.minid.mpid_mso_mdoc
      scope: eudiw:no:minid:mpid
      format: mso_mdoc
      doctype: no.minid.mpid.1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
    - identifier: bong_mso_mdoc
      scope: eudiw:no:minid:mpid
      format: mso_mdoc
      doctype: bong.1
      grant-type: urn:ietf:params:oauth:grant-type:pre-authorized_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].issuer}
      pre-authorization-server: ${credential-issuer-server.pre-authorization-servers[0].issuer}
  claims-sources:
    - doctype: eu.europa.ec.eudi.pid.1
      class-name: no.idporten.eudiw.issuer.claimssource.pid.PIDClaimsSource
    - doctype: no.skatteetaten.nnid.1
      class-name: no.idporten.eudiw.issuer.claimssource.skatteetaten.NnidClaimsSource
    - doctype: no.advokattilsynet.advokatregisteret.1
      class-name: no.idporten.eudiw.issuer.claimssource.advokattilsynet.AdvokatregisteretClaimsSource
    - doctype: no.minid.mpid.1
      class-name: no.idporten.eudiw.issuer.claimssource.minid.MpidClaimsSource
    - doctype: bong.1
      class-name: no.idporten.eudiw.issuer.claimssource.bong.skatteetaten.BongClaimsSource

  key-store:
    type: ${ISSUER_KEYSTORE_TYPE}
    location: ${ISSUER_KEYSTORE_LOCATION}
    password: ${ISSUER_KEYSTORE_PASSWORD}
    key-alias: ${ISSUER_KEYSTORE_KEY_ALIAS}
    key-password: ${ISSUER_KEYSTORE_KEY_PASSWORD}


# Digdir standard logging
digdir:
  audit:
    application-name:  ${spring.application.name}    # recommended naming convention is groupId:artifactId
    application-environment: ${spring.application.environment}
    filters:
      admin-header: false                                     # optional - default 'true'
      bearer-token: false                                    # optional - default 'true'
      ip-address: true                                    # optional - default 'true'
    prometheus:
      counter: false                                     # optional - default 'true'
  ## Eventlogging
  event:
    logging:
      feature-enabled: false

## Folkeregister integration
freg:
  uri: https://folkeregisteret-api-konsument.sits.no/folkeregisteret/offentlig-med-hjemmel/api/
  #uri: https://folkeregisteret.api.skatteetaten.no/folkeregisteret/offentlig-med-hjemmel/api # Prod
  connect-timeout: 5s
  read-timeout: 5s

## Data.altinn.no for advokatbevis
advoktatregisteret:
  uri: https://test-api.data.altinn.no/v1/directharvest/AdvRegPersonPrivat/
  subscription-key: ${ADVOKATREGISTERET_SUBSCRIPTION_KEY}
  scope: altinn:dataaltinnno/advregpersonprivat
  connect-timeout: 5s
  read-timeout: 5s

# Maskinporten
maskinporten:
  oauth2:
    client-id: ${MASKINPORTEN_CLIENT_ID}
    kid: ${MASKINPORTEN_CLIENT_KID}
    audience:
      - ${maskinporten.oauth2.issuer}
    token-endpoint: ${maskinporten.oauth2.issuer}token
    scope: folkeregister:deling/offentligmedhjemmel altinn:dataaltinnno/advregpersonprivat
  jwt-signing-config: #to authenticate towards maskinporten
    key-store-type: JKS
    key-store-location: base64:${MASKINPORTEN_BASE64_KEYSTORE}
    key-store-password: ${MASKINPORTEN_KEYSTORE_PASSWORD}
    key-alias: ${MASKINPORTEN_KEYSTORE_ALIAS}
    key-password: ${MASKINPORTEN_KEY_PASSWORD}