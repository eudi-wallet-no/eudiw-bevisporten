---
server:
  port: 8080

spring:
  thread-executor: virtual
  application:
    name: digital-lommebok-issuer-server
    environment: default
  data:
    redis:
      timeout: 3s
      connect-timeout: 3s

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: info,version,prometheus,health
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.application.environment}

credential-issuer-server:
  metadata-refresh-rate-in-millis: 30000 # 30 seconds (must be > cache TTL)
  features:
    pid-signing-keystore: pid-provider
  cryptographic-bindings:
    - jwk
  proof-signing-algorithms:
    - ES256
  credential-signing-algorithms:
    - ES256
  formats:
    - mso_mdoc
  credential-configurations:
    - identifier: no.digdir.eudiw.pid_mso_mdoc
      scope: eudiw:no:pid
      format: mso_mdoc
      credential-type: eu.europa.ec.eudi.pid.1
      claims-source-uri: class://no.idporten.eudiw.issuer.authoritativesources.pid.PIDMdocClaimsSource
      grant-type: authorization_code
      authorization-server: ${credential-issuer-server.authorization-servers[0].id}
      key-store-name: ${credential-issuer-server.features.pid-signing-keystore}
      credential-metadata: |
        {
          "display" : [ {
            "locale" : "no",
            "name" : "Norsk ID-bevis (mdoc)",
            "description" : null,
            "background_color" : "#afcee9",
            "text_color" : "#002c54"
          } ],
          "claims" : [ {
            "namespace" : "eu.europa.ec.eudi.pid.1",
            "name" : "personal_administrative_number",
            "type" : "string",
            "mime_type" : null,
            "display" : [{
              "locale": "no", "name": "Fødselsnummer"
            }],
            "mandatory" : true,
            "validation_regex" : "^\\d{11}$"
          }, {
            "namespace" : "eu.europa.ec.eudi.pid.1",
            "name" : "given_name",
            "type" : "string",
            "mime_type" : null,
            "display" : [{
              "locale": "no", "name": "Førenamn"
            }],
            "mandatory" : true,
            "validation_regex" : null
          }, {
            "namespace" : "eu.europa.ec.eudi.pid.1",
            "name" : "family_name",
            "type" : "string",
            "mime_type" : null,
            "display" : [{
              "locale": "no", "name": "Etternamn"
            }],
            "mandatory" : true,
            "validation_regex" : null
          }, {
            "namespace" : "eu.europa.ec.eudi.pid.1",
            "name" : "birth_date",
            "type" : "iso_date",
            "mime_type" : null,
            "display" : [{
              "locale": "no", "name": "Fødselsdato"
            }],
            "mandatory" : true,
            "validation_regex" : null
          }, {
            "namespace" : "eu.europa.ec.eudi.pid.1",
            "name" : "place_of_birth",
            "type" : "map",
            "mime_type" : null,
