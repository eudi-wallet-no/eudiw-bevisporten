---
server:
  port: 8080

spring:
  thread-executor: virtual
  application:
    name: digital-lommebok-issuer-server
    environment: default
  data:
    redis:
      timeout: 3s
      connect-timeout: 3s

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: info,version,prometheus,health
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.application.environment}

credential-issuer-server:
  metadata-refresh-rate-in-millis: 30000 # 30 seconds (must be > cache TTL)
  features:
    pid-signing-keystore: pid-provider
  cryptographic-bindings:
    - jwk
  proof-signing-algorithms:
    - ES256
  credential-signing-algorithms:
    - ES256
  tenants:
    root:
      credential-configuration-sources-properties:
        - uri: classpath:credential-configurations/pid/pid_mso_mdoc.json
        - uri: classpath:credential-configurations/pid/pid_sd_jwt_vc.json
        - uri: classpath:credential-configurations/ageverification/proof_of_age_mso_mdoc.json
        - uri: classpath:credential-configurations/vegvesenet/mdl_mso_mdoc.json
        - uri: classpath:credential-configurations/advokattilsynet/advokatbevilling_mso_mdoc.json
        - uri: classpath:credential-configurations/krr/kontaktinformasjon_sd_jwt_vc.json
        - uri: classpath:credential-configurations/skatteetaten/inntekt_sd_jwt_vc.json
        - uri: ${byob-service.uri}
          api-key: ${byob-service.api-key}
          connect-timeout: 2s
          read-timeout: 2s
          cache-ttl: 28s

# Digdir standard logging
digdir:
  access:
    logging:
      debug-level: request
      filtering:
        static-resources: true
  audit:
    application-name:  ${spring.application.name}    # recommended naming convention is groupId:artifactId
    application-environment: ${spring.application.environment}
    filters:
      admin-header: false                                     # optional - default 'true'
      bearer-token: false                                    # optional - default 'true'
      ip-address: true                                    # optional - default 'true'
    prometheus:
      counter: false                                     # optional - default 'true'
  ## Eventlogging
  event:
    logging:
      feature-enabled: false

## Folkeregister integration
freg:
  uri: https://folkeregisteret-api-konsument.sits.no/folkeregisteret/offentlig-med-hjemmel/api/
  #uri: https://folkeregisteret.api.skatteetaten.no/folkeregisteret/offentlig-med-hjemmel/api # Prod
  connect-timeout: 5s
  read-timeout: 5s

## Data.altinn.no for advokatbevis
advoktatregisteret:
  uri: https://test-api.data.altinn.no/v1/directharvest/AdvRegPersonPrivat/
  subscription-key: ${ADVOKATREGISTERET_SUBSCRIPTION_KEY}
  scope: altinn:dataaltinnno/advregpersonprivat
  connect-timeout: 5s
  read-timeout: 5s

## KRR
krr:
  uri: https://test.kontaktregisteret.no/
  scope: krr:global/kontaktinformasjon.read
  connect-timeout: 2s
  read-timeout: 2s

## Inntektsapi fra Skatteetaten
inntektsapi:
  uri: https://inntekt.api.skatteetaten-test.no/
  scope: skatteetaten:inntekt
  connect-timeout: 2s
  read-timeout: 2s

## byob-service: Bring your own bevis service properties
byob-service:
  uri: http://digital-lommebok-byob-service-service:8080/v1/admin/credential-configurations
  api-key: ${API_KEY}
  connect-timeout: 2s
  read-timeout: 2s
  cache-ttl: 28s

# Maskinporten
maskinporten:
  lib:
    enabled: true
    issuer: dummy
    clients:
      freg:
        client-id: ${MASKINPORTEN_CLIENT_ID}
        kid: ${MASKINPORTEN_CLIENT_KID}
        issuer: ${maskinporten.lib.issuer}
        audience:
          - ${maskinporten.lib.issuer}
        token-endpoint: ${maskinporten.lib.issuer}token
        scope: folkeregister:deling/offentligmedhjemmel
        connect-timeout-ms: 5000
        read-timeout-ms: 2000
        key-store-name: maskinporten-freg
      krr:
        client-id: ${MASKINPORTEN_CLIENT_ID}
        kid: ${MASKINPORTEN_CLIENT_KID}
        issuer: ${maskinporten.lib.issuer}
        audience:
          - ${maskinporten.lib.issuer}
        token-endpoint: ${maskinporten.lib.issuer}token
        scope: krr:global/kontaktinformasjon.read krr:global/digitalpost.read
        connect-timeout-ms: 5000
        read-timeout-ms: 2000
        key-store-name: maskinporten-krr
      advokatregisteret:
        client-id: ${MASKINPORTEN_CLIENT_ID}
        kid: ${MASKINPORTEN_CLIENT_KID}
        issuer: ${maskinporten.lib.issuer}
        audience:
          - ${maskinporten.lib.issuer}
        token-endpoint: ${maskinporten.lib.issuer}token
        scope: altinn:dataaltinnno/advregpersonprivat
        connect-timeout-ms: 5000
        read-timeout-ms: 2000
        key-store-name: maskinporten-advokatregisteret
      inntektsapi:
        client-id: ${MASKINPORTEN_CLIENT_ID}
        kid: ${MASKINPORTEN_CLIENT_KID}
        issuer: ${maskinporten.lib.issuer}
        audience:
          - ${maskinporten.lib.issuer}
        token-endpoint: ${maskinporten.lib.issuer}token
        scope: skatteetaten:inntekt
        connect-timeout-ms: 2000
        read-timeout-ms: 2000
        key-store-name: maskinporten-inntektsapi
idporten-key-manager:
  keystores:
    pid-provider:
      key-store-type: ${PID_PROVIDER_KEYSTORE_TYPE}
      key-store-location: ${PID_PROVIDER_KEYSTORE_LOCATION}
      key-store-password: ${PID_PROVIDER_KEYSTORE_PASSWORD}
      key-alias: ${PID_PROVIDER_KEYSTORE_KEY_ALIAS}
      key-password: ${PID_PROVIDER_KEYSTORE_KEY_PASSWORD}
    eaa-provider:
      key-store-type: ${EAA_PROVIDER_KEYSTORE_TYPE}
      key-store-location: ${EAA_PROVIDER_KEYSTORE_LOCATION}
      key-store-password: ${EAA_PROVIDER_KEYSTORE_PASSWORD}
      key-alias: ${EAA_PROVIDER_KEYSTORE_KEY_ALIAS}
      key-password: ${EAA_PROVIDER_KEYSTORE_KEY_PASSWORD}
    maskinporten-freg:
      key-store-type: JKS
      key-store-location: base64:${MASKINPORTEN_BASE64_KEYSTORE}
      key-store-password: ${MASKINPORTEN_KEYSTORE_PASSWORD}
      key-alias: ${MASKINPORTEN_KEYSTORE_ALIAS}
      key-password: ${MASKINPORTEN_KEY_PASSWORD}
    maskinporten-advokatregisteret:
      key-store-type: JKS
      key-store-location: base64:${MASKINPORTEN_BASE64_KEYSTORE}
      key-store-password: ${MASKINPORTEN_KEYSTORE_PASSWORD}
      key-alias: ${MASKINPORTEN_KEYSTORE_ALIAS}
      key-password: ${MASKINPORTEN_KEY_PASSWORD}
    maskinporten-inntektsapi:
      key-store-type: JKS
      key-store-location: base64:${MASKINPORTEN_BASE64_KEYSTORE}
      key-store-password: ${MASKINPORTEN_KEYSTORE_PASSWORD}
      key-alias: ${MASKINPORTEN_KEYSTORE_ALIAS}
      key-password: ${MASKINPORTEN_KEY_PASSWORD}
    maskinporten-krr:
      key-store-type: JKS
      key-store-location: base64:${MASKINPORTEN_BASE64_KEYSTORE}
      key-store-password: ${MASKINPORTEN_KEYSTORE_PASSWORD}
      key-alias: ${MASKINPORTEN_KEYSTORE_ALIAS}
      key-password: ${MASKINPORTEN_KEY_PASSWORD}
