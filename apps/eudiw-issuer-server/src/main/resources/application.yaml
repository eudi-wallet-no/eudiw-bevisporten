---
server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: digital-lommebok-issuer-server
    environment: default
  datasource:
    url: ${MARIADB_URL}
    username: ${MARIADB_USER}
    password: ${MARIADB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    generate-ddl: false
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    open-in-view: false
  flyway:
    table: flyway_schema_history
    locations: classpath:/db/migration
  data:
    redis:
      timeout: 3s
      connect-timeout: 3s

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: info,version,prometheus,health
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
      status:
        order: DOWN, OUT_OF_SERVICE, UNKNOWN, DEGRADED, EXTERNAL_DEPENDENCY_DOWN, UP
  health:
    group:
      readiness:
        include: readinessState,db,redis,statusListServiceHealthCheck,oauthServerHealthCheck
      liveness:
        include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.application.environment}

external-dependency-health-checks:
  health-endpoints:
    status-list-service:
      name: statusListService
      base-uri: http://digital-lommebok-status-list-service-actuator:8090
      endpoint: /health/readiness
      connect-timeout-ms: 2000
      read-timeout-ms: 1000
      map-down-status-to: EXTERNAL_DEPENDENCY_DOWN
    oauth-server:
      name: oauthServer
      base-uri: http://digital-lommebok-oauth-server-service-actuator:8090
      endpoint: /health/readiness
      connect-timeout-ms: 2000
      read-timeout-ms: 1000
      map-down-status-to: EXTERNAL_DEPENDENCY_DOWN

credential-issuer-server:
  metadata-refresh-rate-in-millis: 30000 # 30 seconds (must be > cache TTL)
  features:
    status-list-enabled: true
    revocation-result-endpoint:
      enabled: false
  cryptographic-bindings:
    - jwk
  proof-signing-algorithms:
    - ES256
  credential-signing-algorithms:
    mso_mdoc:
      - -7
    dc+sd-jwt:
      - ES256
  status-list:
    status-issuer:
      enabled: ${credential-issuer-server.features.status-list-enabled}
      api:
        uri: http://digital-lommebok-status-list-service:8080
        api-key: ${STATUS_ISSUER_API_KEY}
        api-key-header: X-API-KEY
        connect-timeout: 2s
        read-timeout: 2s

# Digdir standard logging
digdir:
  access:
    logging:
      debug-level: request
      filtering:
        static-resources: true
  audit:
    application-name: ${spring.application.name}
    application-environment: ${spring.application.environment}
    filters:
      admin-header: false                                     # optional - default 'true'
      bearer-token: false                                    # optional - default 'true'
      ip-address: true                                    # optional - default 'true'
    prometheus:
      counter: false                                     # optional - default 'true'

---
spring:
  config:
    activate:
      on-cloud-platform: 'kubernetes'
    import:
      - 'optional:file:/etc/config/'
