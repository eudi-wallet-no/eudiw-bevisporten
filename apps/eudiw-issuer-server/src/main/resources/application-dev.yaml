---
server:
  port: 9240

management:
  server:
    port: 9240

spring:
  application:
    environment: dev
  data:
    redis:
      port: 9262
      host: localhost

credential-issuer-server:
#  credential-issuer: http://localhost:9240 # bevisporten funkar/lommebok
  credential-issuer: http://issuer-server:9240 # demo-issuer-ui funkar
  features:
    status-list-enabled: true
  authorization-servers:
     ##  Her må jeg ta en titt på URL til oauth
    - id: auth-eidas2sandkasse
      issuer: http://oauth-server:9260
      jwks-uri: http://oauth-server:9260/jwks
      api-key: eudiw
  pre-authorization-servers:
    - id: maskinporten
      issuer: https://maskinporten.dev/
      jwks-uri: https://maskinporten.dev/jwk
  status-list:
    status-issuer:
      api:
        uri: http://status-list:9288
        api-key: secret
  authoritative-sources:
    krr:
      uri: http://authoritative-sources-connector:9298/api/v1/krr/credentialdata/retrieve
      api-key-header: X-API-KEY
      api-key: eudiw
    freg:
      uri: http://authoritative-sources-connector:9298/api/v1/freg/credentialdata/retrieve
      api-key-header: X-API-KEY
      api-key: eudiw
    skatteetaten:
      uri: http://authoritative-sources-connector:9298/api/v1/skatteetaten/credentialdata/retrieve
      api-key-header: X-API-KEY
      api-key: eudiw
    advokatregisteret:
      uri: http://authoritative-sources-connector:9298/api/v1/advokatregisteret/credentialdata/retrieve
      api-key-header: X-API-KEY
      api-key: eudiw
  tenants:
    bevisgenerator:
      display-names:
        "no": "Bevisgenerator"
      credential-configuration-sources-properties:
        - uri: ${byob-service.uri}
          api-key: ${byob-service.api-key}
          connect-timeout: 2s
          read-timeout: 2s
          cache-ttl: 28s
    pid:
      display-names:
        "no": "PID-utsteder"
      credential-configuration-sources-properties:
        - uri: classpath:credential-configurations/pid/pid_mso_mdoc.json
        - uri: classpath:credential-configurations/pid/pid_sd_jwt_vc.json
    demo-pid-issuer:
      display-names:
        "no": "Demo PID-utsteder"
      credential-configuration-sources-properties:
        - uri: classpath:credential-configurations/pid/pid_preauth_mso_mdoc.json

advoktatregisteret:
  subscription-key: e944aaaf24a24dfb8352d1d49ddbd79f

byob-service:
  uri: http://byob-service:9296/v1/admin/credential-configurations
  api-key: invalid

idporten-key-manager:
  keystores:
    pid-provider:
      key-store-type: pkcs12
      key-store-location: base64:
      key-store-password: changeit
      key-alias: pid-issuer
      key-password: changeit
    eaa-provider:
      key-store-type: pkcs12
      key-store-location: base64:
      key-store-password: changeit
      key-alias: eaa-issuer
      key-password: changeit
