---
server:
  port: 8080

spring:
  thread-executor: virtual
  application:
    name: digital-lommebok-status-list
    environment: default

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: info,version,prometheus,health
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.application.environment}

status-list:
  uri: https://status.eidas2sandkasse.dev

idporten-key-manager:
  enabled: false
