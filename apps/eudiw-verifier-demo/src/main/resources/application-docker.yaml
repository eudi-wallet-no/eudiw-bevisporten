# local dev profile
spring:
  application:
    environment: docker
  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8443
  ssl:
    enabled: true
    protocol: TLS
    key-store-type: JKS
    key-store: classpath:selfsigned.jks
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
    key-alias: ${SERVER_SSL_KEY_ALIAS}
    key-password: ${SERVER_SSL_KEY_PASSWORD}
management:
  server:
    port: 8090

vcverifier:
  siop2ClientId: abr.vc.local
  client-identifier-scheme: x509_hash
  authorization-request-url-scheme: eudi-openid4vp
  externalBaseUrl: https://abr.vc.local:8082
