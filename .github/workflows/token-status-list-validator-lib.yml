name: token-status-list-validator-lib

on:
  pull_request:
    branches: [main]
    paths:
      - 'libs/token-status-list-validator-lib/**'
      - '.github/workflows/token-status-list-validator-lib.yml'
  release:
    types:
      - created

jobs:
  pull-request-checks:
    if: github.event_name == 'pull_request'
    uses: felleslosninger/github-workflows/.github/workflows/ci-pr-checks-lib.yml@main
    with:
      application-path: libs/token-status-list-validator-lib/
    secrets: inherit
  create-release:
    if: github.event_name == 'release'
    uses: felleslosninger/github-workflows/.github/workflows/ci-build-publish-lib.yml@main
    permissions:
      contents: read
      packages: write
    with:
      application-path: libs/token-status-list-validator-lib/
      package-version: token-status-list-validator-lib-${{ github.event.release.tag_name }}
    secrets: inherit
