version: 2

registries:
  maven-github:
    type: maven-repository
    url: https://maven.pkg.github.com/felleslosninger
    username: ${{secrets.GH_PACKAGES_READ_USER}}
    password: ${{secrets.GH_PACKAGES_READ_PAT}}

# Én PR per app med alle dens oppgraderinger. Eksplisitt per-app `directory` (ikke
# `directories`-wildcard) gir app-vis review og støtter @dependabot rebase/recreate.
# Ikke gjeninnfør group-by: dependency-name (kan ikke rebases, dependabot-core#14780).
# YAML-anchors støttes ikke av Dependabot, så oppsettet gjentas per app.
#
# Hver app er en egen seksjon. Docker-oppføringer er utelatt: base-images
# hentes dynamisk og håndteres utenfor dependabot.
updates:
  # ============================================================
  # eudiw-authoritativ-sources-connector
  # ============================================================
  - package-ecosystem: maven
    directory: /apps/eudiw-authoritativ-sources-connector
    registries:
      - maven-github
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - eudiw-authoritativ-sources-connector
    groups:
      alle-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot:spring-boot-starter-parent"
      security:
        applies-to: security-updates
        patterns:
          - "*"

