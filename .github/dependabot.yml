version: 2

registries:
  maven-github:
    type: maven-repository
    url: https://maven.pkg.github.com/felleslosninger
    username: ${{secrets.GH_PACKAGES_READ_USER}}
    password: ${{secrets.GH_PACKAGES_READ_PAT}}

updates:
  # ==============
  # MAVEN (Spring Boot-apper)
  # ==============
  # Eksplisitt konfigurasjon per app sikrer full støtte for Dependabot-kommandoer
  # som @dependabot rebase og @dependabot recreate, samt isolert review og feilsøking.
  - package-ecosystem: "maven"
    directory: "/apps/eudiw-authoritativ-sources-connector"
    registries:
      - maven-github
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      patch-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"

